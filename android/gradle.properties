# Cap the JVM so GitHub-hosted runners (~7 GB RAM) and typical laptops
# can finish Android release builds. 8G heap + 4G metaspace OOM-kills
# `ubuntu-latest` (exit 143 / SIGTERM).
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# mobile_scanner: pull the ML Kit barcode model from Play Services on first
# scan instead of shipping libbarhopper + TFLite (~5–8 MB per ABI). QR scanning
# then needs Google Play Services; TOTP secrets can still be typed by hand.
dev.steenbakker.mobile_scanner.useUnbundled=true
